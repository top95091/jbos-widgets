<!DOCTYPE html>
<html lang="ko">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>금리</title>
 <style>
  :root{--up:#e03131;--down:#1c7ed6;--text:#131722;--sub:#787b86;--border:#eceef1;--bg:#ffffff;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Trebuchet MS",Roboto,Ubuntu,sans-serif;background:var(--bg);color:var(--text);}
  .card{border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--bg);}
  .card-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border);}
  .card-title{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--text);}
  .dot{width:7px;height:7px;border-radius:50%;background:#7b1fa2;display:inline-block;}
  .badge{font-size:11px;color:var(--sub);}
  .tv-wrap{height:300px;width:100%;}
  .kr-section{border-top:1px solid var(--border);}
  .kr-header{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 4px 14px;}
  .kr-header-title{font-size:11px;color:var(--sub);font-weight:600;}
  .kr-header-badge{font-size:10px;color:#9c6b00;background:#fff4e0;border:1px solid #ffe3ad;border-radius:10px;padding:1px 8px;}
  .kr-row{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-top:1px solid var(--border);}
  .kr-row:first-of-type{border-top:none;}
  .kr-name{font-size:13px;font-weight:600;color:var(--text);}
  .kr-desc{font-size:11px;color:var(--sub);margin-top:1px;}
  .kr-value{text-align:right;}
  .kr-value .num{font-size:14px;font-weight:700;color:var(--text);}
  .kr-value .date{font-size:10px;color:var(--sub);margin-top:1px;}
  .kr-footer{padding:6px 14px 10px 14px;font-size:10px;color:var(--sub);}
  .kr-footer a{color:var(--down);text-decoration:none;}
  </style>
 </head>
 <body>
  <div class="card">
   <div class="card-header">
    <div class="card-title"><span class="dot"></span>span>금리 (기준금리·국채)</div>div>
    <div class="badge">실시간 · TradingView</div>div>
   </div>div>
   <div class="tv-wrap">
    <div class="tradingview-widget-container" style="height:100%;width:100%">
     <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>div>
     <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
      {
       "colorTheme": "light",
        "dateRange": "12M",
        "showChart": true,
        "locale": "kr",
        "largeChartUrl": "",
        "isTransparent": false,
        "showSymbolLogo": true,
        "showFloatingTooltip": false,
        "width": "100%",
        "height": "100%",
        "plotLineColorGrowing": "rgba(224, 49, 49, 1)",
        "plotLineColorFalling": "rgba(28, 126, 214, 1)",
        "gridLineColor": "rgba(240, 243, 250, 0)",
        "scaleFontColor": "rgba(19, 23, 34, 1)",
        "belowLineFillColorGrowing": "rgba(224, 49, 49, 0.12)",
        "belowLineFillColorFalling": "rgba(28, 126, 214, 0.12)",
        "belowLineFillColorGrowingBottom": "rgba(224, 49, 49, 0)",
        "belowLineFillColorFallingBottom": "rgba(28, 126, 214, 0)",
        "symbolActiveColor": "rgba(224, 49, 49, 0.12)",
        "tabs": [
        {
         "title": "미국",
         "symbols": [
          { "s": "FRED:DFF", "d": "미국 기준금리(FF)" },
          { "s": "FRED:DGS10", "d": "미국 10년물 국채" }
          ],
         "originalTitle": "미국"
        }
        ]
      }
     </script>
    </div>div>
   </div>div>
   <div class="kr-section">
    <div class="kr-header">
     <div class="kr-header-title">한국 (수동 업데이트)</div>div>
     <div class="kr-header-badge">MANUAL</div>div>
    </div>div>
    <div class="kr-row">
     <div>
      <div class="kr-name">한국 기준금리</div>
      <div class="kr-desc">한국은행 base rate</div>
     </div>
     <div class="kr-value">
      <div class="num">2.75%</div>
      <div class="date">2026.07.16 인상</div>
     </div>
    </div>
    <div class="kr-row">

      <div class="num">4.14%</div>

     </div>
    </div>
    <div class="kr-footer">

     <a href="https://tradingeconomics.com/south-korea/government-bond-yield" target="_blank">국고채10년</a>a>
    </div>
   </div>
  </div>
 </body>
</html>
